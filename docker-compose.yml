
version: '3.8'

services:
  postgres-users-db:
    image: postgres:15-alpine
    container_name: users_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: users_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    networks:
      - users-network

volumes:
  postgres_users_data:
    driver: local

networks:
  users-network:
    driver: bridge
